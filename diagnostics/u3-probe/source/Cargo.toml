[package]
name = "formicarium-guests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "formicarium の合格判定用ゲスト（static-musl x86-64）。probe・hello・exit3 の 3 つのバイナリ。"

[[bin]]
name = "probe"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[profile.release]
# デバッグ情報を落としてバイナリを小さくする（blink に読み込ませる量を減らす）。
strip = true
