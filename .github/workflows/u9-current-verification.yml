name: U9 current R04 source verification
on:
  push:
    branches: [codex/u9-current-verification]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: nightly-2026-10-10
  CARGO_TERM_COLOR: never
jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - name: Current U9 internal public compile-fail and CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/u9-quality-evidence
          e=target/u9-quality-evidence
          exec > >(tee "$e/tests.log") 2>&1
          rustup toolchain install nightly-2026-10-10 --profile minimal --component rustfmt --component clippy
          rustc -Vv
          printf 'CI_HEAD=%s\n' "$GITHUB_SHA"
          python - <<'PY'
          import hashlib,pathlib
          paths=sorted(p for root in ["crates","tests","packages","scripts","fuzz/fuzz_targets"] for p in pathlib.Path(root).rglob("*") if p.is_file() and "target" not in p.parts and p.suffix!=".wasm")
          paths += [pathlib.Path(p) for p in ["Cargo.toml","Cargo.lock","rust-toolchain.toml","fuzz/Cargo.toml","fuzz/Cargo.lock","fuzz/lsan.supp"]]
          pathlib.Path("target/u9-quality-evidence/source-before.sha256").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.as_posix()+"\n" for p in paths))
          PY
          cargo test --locked -p paludarium-host -p paludarium-kernel -p paludarium-runtime --lib u9_ -- --nocapture
          cargo test --locked -p paludarium-host --test u9_public_api
          cargo test --locked -p paludarium-host -p paludarium-runtime --doc Terminal
          cargo test --locked -p paludarium --test command u9_ -- --nocapture
          printf '0\n' > "$e/test-exit.txt"
      - name: Current U9 lint and all four dependency checks
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          e=target/u9-quality-evidence
          exec > >(tee "$e/lint-dependencies.log") 2>&1
          cargo fmt -p paludarium-host -p paludarium-kernel -p paludarium-runtime -p paludarium -p paludarium-harness --check
          cargo clippy --locked -p paludarium-host -p paludarium-kernel -p paludarium-runtime -p paludarium -p paludarium-harness --all-targets -- -D warnings
          cargo install --locked --version 0.20.2 cargo-deny
          cargo deny --version
          cargo deny --locked check
          printf '0\n' > "$e/lint-deny-exit.txt"
      - name: Source unchanged after tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,pathlib
          b=pathlib.Path("target/u9-quality-evidence")
          paths=sorted(p for root in ["crates","tests","packages","scripts","fuzz/fuzz_targets"] for p in pathlib.Path(root).rglob("*") if p.is_file() and "target" not in p.parts and p.suffix!=".wasm")
          paths += [pathlib.Path(p) for p in ["Cargo.toml","Cargo.lock","rust-toolchain.toml","fuzz/Cargo.toml","fuzz/Cargo.lock","fuzz/lsan.supp"]]
          (b/"source-after.sha256").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.as_posix()+"\n" for p in paths))
          match=(b/"source-before.sha256").read_bytes()==(b/"source-after.sha256").read_bytes()
          (b/"source-compare-exit.txt").write_text("0\n" if match else "1\n")
          assert match
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u9-current-quality-${{ matrix.os }}
          path: target/u9-quality-evidence/
          retention-days: 7
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_TEST_THREADS: '1'
      PALUDARIUM_U5_EMULATOR: ${{ github.workspace }}/target/llvm-cov-target/debug/paludarium
      PALUDARIUM_U6_EMULATOR: ${{ github.workspace }}/target/llvm-cov-target/debug/paludarium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare latest fixed tools and source audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/u9-current-evidence
          exec > >(tee target/u9-current-evidence/environment.log) 2>&1
          test "$(uname -m)" = x86_64
          uname -a
          lscpu
          printf 'CI_HEAD=%s\n' "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install nightly-2026-10-10 --profile minimal --component llvm-tools-preview --target x86_64-unknown-linux-musl
          cargo install --locked --version 0.9.1 cargo-llvm-cov
          rustc -Vv
          cargo llvm-cov --version
          find crates tests packages scripts fuzz/fuzz_targets -type f ! -path '*/target/*' ! -name '*.wasm' -print0 | sort -z | xargs -0 sha256sum > target/u9-current-evidence/source-before.sha256
          sha256sum Cargo.toml Cargo.lock rust-toolchain.toml fuzz/Cargo.toml fuzz/Cargo.lock fuzz/lsan.supp >> target/u9-current-evidence/source-before.sha256
      - name: Fresh native Linux U9 differential
        shell: bash
        run: |
          set -euo pipefail
          evidence=target/u9-current-evidence
          bash tests/guests/u9/build.sh target/guests/u9
          cargo test --locked -p paludarium-harness --test diff_u9 -- --list 2>&1 | tee "$evidence/list.log"
          grep -q '14 tests, 0 benchmarks' "$evidence/list.log"
          set +e
          cargo test --locked -p paludarium-harness --test diff_u9 -- --nocapture 2>&1 | tee "$evidence/diff-u9.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$evidence/diff-u9-exit.txt"
          test "$status" = 0
          grep -q '14 passed; 0 failed; 0 ignored' "$evidence/diff-u9.log"
      - name: Exact U9 production file set coverage at least 80 percent
        shell: bash
        run: |
          set -euo pipefail
          evidence=target/u9-current-evidence
          bash tests/guests/build.sh
          cargo llvm-cov clean --workspace
          (
            source <(cargo llvm-cov show-env --sh)
            cargo build --locked -p paludarium --target-dir target/llvm-cov-target
          )
          set +e
          cargo llvm-cov --no-clean --locked -p paludarium-host -p paludarium-kernel -p paludarium-runtime -p paludarium -p paludarium-harness --lib --test diff_u9 --test command --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|vfs|jit|harness)/' --fail-under-lines 80 --lcov --output-path target/u9-coverage.lcov -- --test-threads=1 --nocapture 2>&1 | tee "$evidence/coverage.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$evidence/coverage-exit.txt"
          cp target/u9-coverage.lcov "$evidence/"
          set +e
          cargo llvm-cov report --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|vfs|jit|harness)/' --json --output-path "$evidence/coverage.json" 2>&1 | tee "$evidence/coverage-report.log"
          reported=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$reported" > "$evidence/report-exit.txt"
          test "$status" = 0
          test "$reported" = 0
      - name: Preserve every input and actual result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e=target/u9-current-evidence
          find crates tests packages scripts fuzz/fuzz_targets -type f ! -path '*/target/*' ! -name '*.wasm' -print0 | sort -z | xargs -0 sha256sum > "$e/source-after.sha256"
          sha256sum Cargo.toml Cargo.lock rust-toolchain.toml fuzz/Cargo.toml fuzz/Cargo.lock fuzz/lsan.supp >> "$e/source-after.sha256"
          set +e
          cmp "$e/source-before.sha256" "$e/source-after.sha256" > "$e/source-compare.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$e/source-compare-exit.txt"
          test "$status" = 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u9-current-coverage
          path: target/u9-current-evidence/
          retention-days: 7
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Current production wasm and all Node cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/u9-production-evidence
          e=target/u9-production-evidence
          exec > >(tee "$e/raw.log") 2>&1
          rustup toolchain install nightly-2026-10-10 --profile minimal --component rust-src --target wasm32-unknown-unknown
          rustc -Vv
          curl -fsSLO https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          curl -fsSLO https://nodejs.org/dist/v26.11.1/SHASUMS256.txt
          sha256sum --check --ignore-missing SHASUMS256.txt
          tar -xf node-v26.11.1-linux-x64.tar.xz
          export PATH="$PWD/node-v26.11.1-linux-x64/bin:$PATH"
          node --version
          find crates tests packages scripts fuzz/fuzz_targets -type f ! -path '*/target/*' ! -name '*.wasm' -print0 | sort -z | xargs -0 sha256sum > "$e/source-before.sha256"
          sha256sum Cargo.toml Cargo.lock rust-toolchain.toml fuzz/Cargo.toml fuzz/Cargo.lock fuzz/lsan.supp >> "$e/source-before.sha256"
          python3 packages/paludarium-wasm/tests/generate-guests.py --check
          python3 scripts/wasm-native-guests.py > "$e/native-results.json"
          export RUSTFLAGS='-C target-feature=+atomics,+bulk-memory,+mutable-globals -C link-arg=--import-memory -C link-arg=--shared-memory -C link-arg=--max-memory=1073741824 -C link-arg=--export=__stack_pointer -C link-arg=--export=__wasm_init_tls -C link-arg=--export=__tls_size -C link-arg=--export=__tls_align -C link-arg=--export=__tls_base'
          cargo +nightly-2026-10-10 build --locked -Z build-std=std,panic_abort --release --target wasm32-unknown-unknown -p paludarium-wasm
          cp target/wasm32-unknown-unknown/release/paludarium_wasm.wasm packages/paludarium-wasm/paludarium.wasm
          sha256sum packages/paludarium-wasm/paludarium.wasm "$e/native-results.json" > "$e/module-native.sha256"
          node --test packages/paludarium-wasm/tests/import-check.mjs
          set +e
          node packages/paludarium-wasm/tests/node-check.mjs packages/paludarium-wasm/paludarium.wasm "$e/native-results.json" > "$e/node-report.json" 2> "$e/node.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$e/node-exit.txt"
          cat "$e/node-report.json"
          test "$status" = 0
          python3 -c 'import json; x=json.load(open("target/u9-production-evidence/node-report.json")); assert x["pass"] and x["caseCount"]>=14 and all(r["pass"] for r in x["results"])'
          cp packages/paludarium-wasm/paludarium.wasm "$e/"
      - name: Production source unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e=target/u9-production-evidence
          find crates tests packages scripts fuzz/fuzz_targets -type f ! -path '*/target/*' ! -name '*.wasm' -print0 | sort -z | xargs -0 sha256sum > "$e/source-after.sha256"
          sha256sum Cargo.toml Cargo.lock rust-toolchain.toml fuzz/Cargo.toml fuzz/Cargo.lock fuzz/lsan.supp >> "$e/source-after.sha256"
          cmp "$e/source-before.sha256" "$e/source-after.sha256"
          printf '0\n' > "$e/source-compare-exit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u9-current-production
          path: target/u9-production-evidence/
          retention-days: 7
  safari:
    needs: production
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: u9-current-production
          path: target/u9-production-evidence
      - name: Real Safari same module and fresh native expectations
        shell: bash
        run: |
          set -euo pipefail
          e=target/u9-safari-evidence
          mkdir -p "$e"
          cp target/u9-production-evidence/paludarium.wasm packages/paludarium-wasm/paludarium.wasm
          arch=$(uname -m)
          if [ "$arch" = arm64 ]; then node_arch=arm64; else node_arch=x64; fi
          export NODE_ARCHIVE="node-v26.11.1-darwin-${node_arch}.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/v26.11.1/$NODE_ARCHIVE"
          curl -fsSLO https://nodejs.org/dist/v26.11.1/SHASUMS256.txt
          python3 - <<'PY'
          import os, hashlib, pathlib
          p=pathlib.Path(os.environ["NODE_ARCHIVE"])
          expected=next(line.split()[0] for line in pathlib.Path("SHASUMS256.txt").read_text().splitlines() if line.split()[-1]==p.name)
          assert hashlib.sha256(p.read_bytes()).hexdigest()==expected
          PY
          tar -xf "$NODE_ARCHIVE"
          export PATH="$PWD/node-v26.11.1-darwin-${node_arch}/bin:$PATH"
          node --version > "$e/environment.log"
          /usr/bin/safaridriver --version >> "$e/environment.log"
          sw_vers >> "$e/environment.log"
          shasum -a 256 -c target/u9-production-evidence/module-native.sha256
          shasum -a 256 packages/paludarium-wasm/paludarium.wasm target/u9-production-evidence/native-results.json > "$e/module-native.sha256"
          sudo /usr/bin/safaridriver --enable
          export SAFARI_STATIC_ROOT="$PWD"
          export SAFARI_ENTRY_PATH='/packages/paludarium-wasm/tests/index.html?wasm=/packages/paludarium-wasm/paludarium.wasm&native=/target/u9-production-evidence/native-results.json'
          export SAFARI_REPORT_KEY=__paludariumProductionReport
          python3 - <<'PY'
          import os, signal, subprocess, pathlib
          e=pathlib.Path("target/u9-safari-evidence")
          p=subprocess.Popen(["node",".github/scripts/u9-safari-diagnostic.mjs"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)
          try:
              stdout,stderr=p.communicate(timeout=30)
          except subprocess.TimeoutExpired:
              os.killpg(p.pid,signal.SIGKILL)
              stdout,stderr=p.communicate()
              (e/"timeout.txt").write_text("30 second whole-process watchdog\n")
          (e/"safari-report.json").write_bytes(stdout)
          (e/"safari.stderr").write_bytes(stderr)
          (e/"exit.txt").write_text(str(p.returncode)+"\n")
          assert p.returncode==0
          PY
          cat "$e/safari-report.json"
          python3 - <<'PY'
          import json
          x=json.load(open("target/u9-safari-evidence/safari-report.json"))
          n=json.load(open("target/u9-production-evidence/node-report.json"))
          assert x["pass"] and x["crossOriginIsolated"] and x["productionLauncher"] and x["sharedMemory"]
          assert x["caseCount"]==n["caseCount"] and [r["case"] for r in x["results"]]==[r["case"] for r in n["results"]]
          assert all(r["pass"] for r in x["results"]) and x["elapsed_ms"]<30000
          assert x["cleanup"]["driver_reaped"] and x["cleanup"]["server_closed"]
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u9-current-safari
          path: target/u9-safari-evidence/
          retention-days: 7
  asan:
    name: ASan ${{ matrix.target }} (10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [load_elf]
    container:
      image: rust:1-bookworm
      options: --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined --ulimit=stack=-1
    env:
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: nightly-2026-10-10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare native runner and record source
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/u9-asan-evidence
          exec > >(tee target/u9-asan-evidence/environment.log) 2>&1
          test "$(uname -m)" = x86_64
          uname -a
          lscpu
          id
          cat /proc/self/status
          printf 'CI_HEAD=%s\nTARGET=%s\n' "$GITHUB_SHA" '${{ matrix.target }}'
          ln -s "$GITHUB_WORKSPACE" /work
          apt-get update
          apt-get install -y --no-install-recommends llvm binutils
          rustup toolchain install nightly-2026-10-10 --profile minimal
          cargo +nightly-2026-10-10 install --locked --version 0.13.2 cargo-fuzz
          rustc +nightly-2026-10-10 -Vv
          cargo +nightly-2026-10-10 -V
          cargo +nightly-2026-10-10 fuzz --version
          cc --version
          dpkg-query -W libc6 gcc llvm
          find crates tests packages scripts fuzz/fuzz_targets -type f ! -path '*/target/*' ! -name '*.wasm' -print0 | sort -z | xargs -0 sha256sum > target/u9-asan-evidence/source-before.sha256
          sha256sum Cargo.toml Cargo.lock rust-toolchain.toml fuzz/Cargo.toml fuzz/Cargo.lock fuzz/lsan.supp >> target/u9-asan-evidence/source-before.sha256
      - name: Check sanitizer exit independently
        shell: bash
        run: |
          set -euo pipefail
          cd /work
          evidence=target/u9-asan-evidence
          export LSAN_OPTIONS=suppressions=/work/fuzz/lsan.supp
          export ASAN_OPTIONS=detect_leaks=1
          printf 'int main(void) { return 0; }\n' > "$evidence/minimal.c"
          cc -fsanitize=address -g -O1 "$evidence/minimal.c" -o "$evidence/minimal-asan"
          for attempt in 1 2; do
            set +e
            "$evidence/minimal-asan" > "$evidence/minimal-$attempt.log" 2>&1
            status=$?
            set -e
            printf '%s\n' "$status" > "$evidence/minimal-$attempt-exit.txt"
          done
          printf 'LSAN_OPTIONS=%s\nASAN_OPTIONS=%s\n' "$LSAN_OPTIONS" "$ASAN_OPTIONS" > "$evidence/minimal-settings.txt"
          test "$(cat "$evidence/minimal-1-exit.txt")" = 0
          test "$(cat "$evidence/minimal-2-exit.txt")" = 0
      - name: Run unchanged target for 600 seconds
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd /work
          evidence=target/u9-asan-evidence
          target='${{ matrix.target }}'
          mkdir -p "fuzz/corpus/$target" "fuzz/artifacts/$target"
          tar -cf "$evidence/corpus-before.tar" "fuzz/corpus/$target" "fuzz/artifacts/$target"
          export LSAN_OPTIONS=suppressions=/work/fuzz/lsan.supp
          export ASAN_OPTIONS=detect_leaks=1
          printf 'seed=1\nsanitizer=address\nLSAN_OPTIONS=%s\nASAN_OPTIONS=%s\nCI_HEAD=%s\n' "$LSAN_OPTIONS" "$ASAN_OPTIONS" "$GITHUB_SHA" > "$evidence/settings.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$evidence/start.txt"
          set +e
          cargo +nightly-2026-10-10 fuzz run --fuzz-dir fuzz --sanitizer address "$target" -- -seed=1 -max_total_time=600 -timeout=30 -rss_limit_mb=2048 2>&1 | tee "$evidence/$target.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$evidence/exit.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$evidence/end.txt"
          find crates tests packages scripts fuzz/fuzz_targets -type f ! -path '*/target/*' ! -name '*.wasm' -print0 | sort -z | xargs -0 sha256sum > "$evidence/source-after.sha256"
          sha256sum Cargo.toml Cargo.lock rust-toolchain.toml fuzz/Cargo.toml fuzz/Cargo.lock fuzz/lsan.supp >> "$evidence/source-after.sha256"
          set +e
          cmp "$evidence/source-before.sha256" "$evidence/source-after.sha256" > "$evidence/source-compare.log" 2>&1
          compared=$?
          set -e
          printf '%s\n' "$compared" > "$evidence/source-compare-exit.txt"
          tar -cf "$evidence/corpus-after.tar" "fuzz/corpus/$target" "fuzz/artifacts/$target"
          binary="fuzz/target/x86_64-unknown-linux-gnu/release/$target"
          if [ -f "$binary" ]; then
            sha256sum "$binary" > "$evidence/binary.sha256"
            nm "$binary" > "$evidence/binary-symbols.txt"
          fi
          test "$status" = 0
          test "$compared" = 0
      - name: Preserve logs and inputs for every result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u9-asan-${{ matrix.target }}
          path: target/u9-asan-evidence/
          retention-days: 7
