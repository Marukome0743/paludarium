name: U11 current verification
on:
  workflow_dispatch:
  push:
    branches: [codex/u11-wasm-launcher, codex/u11-current-verification]
permissions:
  contents: read
jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.11.1'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake perl make pkg-config
      - run: rustup toolchain install nightly-2026-10-10 --profile minimal --component rust-src
      - run: rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown --toolchain nightly-2026-10-10
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0
        with:
          tool: cargo-deny@0.20.2
      - run: python -m unittest discover -s tests/guests/u11/runner-tests -p 'test_*.py'
      - run: bash scripts/u10-build-guests.sh target/guests/u10
      - run: sudo unshare --net "$(command -v python)" scripts/u11-run.py --native-only --guest-dir target/guests/u10 --output target/u11/native
      - run: bash scripts/build-wasm.sh
      - name: Fresh U5 U6 shared-node regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/u11-shared-regressions
          cargo build --locked -p paludarium
          cargo test --locked -p paludarium-harness --test diff_u5 --test diff_u6 -- --nocapture 2>&1 | tee target/u11-shared-regressions/differential.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: u11-current-inputs
          path: |
            target/guests/u10/
            target/u11/native/
            target/u11-shared-regressions/
            packages/paludarium-wasm/paludarium.wasm
          retention-days: 14
  consumer:
    needs: producer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            environment: node
          - os: ubuntu-latest
            environment: chromium
          - os: ubuntu-latest
            environment: firefox
          - os: macos-latest
            environment: safari
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.11.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: u11-current-inputs
          path: .
      - name: Use the approved current npm
        run: |
          npm install --global npm@12.2.0
          npm --version
      - if: matrix.environment == 'chromium' || matrix.environment == 'firefox'
        run: |
          npm ci --prefix spikes/wasm-threads
          node spikes/wasm-threads/node_modules/playwright/cli.js install --with-deps ${{ matrix.environment }}
          node packages/paludarium-wasm/tests/u11-browser-ready.mjs ${{ matrix.environment }}
      - if: matrix.environment == 'safari'
        run: |
          sudo safaridriver --enable
          node packages/paludarium-wasm/tests/u11-browser-ready.mjs safari
      - name: Actual guest suite and C12 with process-group cleanup
        env:
          U11_ENVIRONMENT: ${{ matrix.environment }}
          NODE_V8_COVERAGE: ${{ github.workspace }}/target/u11/v8-coverage
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil, sys
          sys.path.insert(0, 'tests/guests/u11')
          from supervisor import supervise
          environment = os.environ['U11_ENVIRONMENT']
          output = pathlib.Path('target/u11') / environment
          output.mkdir(parents=True, exist_ok=True)
          if environment == 'node':
              for command in [['node','--test','packages/paludarium-wasm/tests/u11-contract.test.mjs','packages/paludarium-wasm/tests/u11-browser-driver.test.mjs','packages/paludarium-wasm/tests/u11-filesystem.test.mjs','packages/paludarium-wasm/tests/u11-worker-support.test.mjs','packages/paludarium-wasm/tests/u7-mtime-snapshot.test.mjs'], ['node','packages/paludarium-wasm/tests/u11-api-check.mjs','packages/paludarium-wasm/paludarium.wasm']]:
                  result = supervise(command, cwd=pathlib.Path.cwd(), seconds=60)
                  print(json.dumps(result))
                  assert result['exit'] == 0 and result['process_group_cleaned'] and not result['timed_out']
          command = ['node','packages/paludarium-wasm/tests/u11-node-check.mjs'] if environment == 'node' else ['node','packages/paludarium-wasm/tests/u11-browser-check.mjs',environment]
          command += ['packages/paludarium-wasm/paludarium.wasm','target/u11/native/observations.json','target/guests/u10',str(output)]
          result = supervise(command, cwd=pathlib.Path.cwd(), seconds=600)
          (output/'suite-supervisor.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          assert result['exit'] == 0 and result['process_group_cleaned'] and not result['timed_out']
          report = json.loads((output/'observations.json').read_text())
          assert report['complete'] and len(report['rows']) == 14
          assert all(row['pass'] and row['exit'] == 0 and not row['timed_out'] for row in report['rows'].values())
          PY
      - name: Complete JS product population coverage
        if: matrix.environment == 'node'
        run: node aidlc/spaces/default/intents/261004-rust-blink-port/construction/u11-wasm-launcher/code-generation/verification/current-js-coverage.mjs target/u11/v8-coverage target/u11/node/js-coverage.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: u11-current-${{ matrix.environment }}
          path: |
            target/u11/${{ matrix.environment }}/
            target/u11/v8-coverage/
          retention-days: 14
