name: U11 memory ownership diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: rust:1-bookworm
      options: --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined --ulimit=stack=-1
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-10
      ASAN_OPTIONS: detect_leaks=1
      LSAN_OPTIONS: suppressions=/work/fuzz/lsan.supp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ln -s "$GITHUB_WORKSPACE" /work
      - run: rustup toolchain install nightly-2026-10-10 --profile minimal --component llvm-tools-preview
      - run: cargo install --locked --version 0.13.2 cargo-fuzz
      - name: Install the official LLVM symbolizer
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          curl --fail --location https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          printf '%s\n' 'deb https://apt.llvm.org/bookworm/ llvm-toolchain-bookworm main' > /etc/apt/sources.list.d/llvm-symbolizer.list
          apt-get update
          apt-get install -y --no-install-recommends llvm-23
      - name: Record symbols and the same bounded memory check
        shell: bash
        run: |
          set -euo pipefail
          cd /work
          mkdir -p target/u11-memory-diagnostic
          rustc -Vv > target/u11-memory-diagnostic/toolchain.txt
          sha256sum Cargo.lock fuzz/Cargo.lock > target/u11-memory-diagnostic/locks-before.sha256
          find "$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin" -maxdepth 1 -type f -executable -print > target/u11-memory-diagnostic/rust-llvm-tools.txt
          command -v llvm-symbolizer-23 > target/u11-memory-diagnostic/symbolizer-path.txt
          dpkg-query -W llvm-23 > target/u11-memory-diagnostic/symbolizer-package.txt
          symbolizer="$(command -v llvm-symbolizer-23)"
          test -x "$symbolizer"
          export ASAN_SYMBOLIZER_PATH="$symbolizer"
          "$symbolizer" --version > target/u11-memory-diagnostic/symbolizer.txt
          set +e
          cargo fuzz run --fuzz-dir fuzz --sanitizer address syscall_args -- -seed=1 -max_total_time=600 -timeout=30 -rss_limit_mb=2048 2>&1 | tee target/u11-memory-diagnostic/raw.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > target/u11-memory-diagnostic/exit.txt
          sha256sum Cargo.lock fuzz/Cargo.lock > target/u11-memory-diagnostic/locks-after.sha256
          cmp target/u11-memory-diagnostic/locks-before.sha256 target/u11-memory-diagnostic/locks-after.sha256
          sha256sum fuzz/target/x86_64-unknown-linux-gnu/release/syscall_args > target/u11-memory-diagnostic/binary.sha256
          test "$status" = 0
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: u11-memory-diagnostic
          path: |
            target/u11-memory-diagnostic
            fuzz/artifacts/syscall_args
            fuzz/target/x86_64-unknown-linux-gnu/release/syscall_args
