name: U11 browser runner readiness
on:
  workflow_dispatch:
  push:
    branches: [codex/u11-wasm-launcher]
    paths:
      - .github/workflows/u11-browser-readiness.yml
      - packages/paludarium-wasm/tests/u11-browser-driver.mjs
      - packages/paludarium-wasm/tests/u11-browser-ready.mjs
permissions:
  contents: read
jobs:
  browsers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chromium firefox
          - os: macos-latest
            browsers: safari
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install pinned browser driver
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix spikes/wasm-threads
          node spikes/wasm-threads/node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Enable actual Safari automation on CI runner
        if: runner.os == 'macOS'
        run: sudo safaridriver --enable
      - name: Check isolated page and shared Worker readiness
        run: node packages/paludarium-wasm/tests/u11-browser-ready.mjs ${{ matrix.browsers }}
