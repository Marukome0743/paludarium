name: U10 native expectations
on:
  push:
    branches: [codex/u10-native-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-first:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake perl make pkg-config
      - run: rustup toolchain install nightly-2026-10-01 --profile minimal
      - run: rustup target add x86_64-unknown-linux-musl --toolchain nightly-2026-10-01
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0
        with:
          tool: cargo-deny
      - name: Runner readiness before native expectations
        run: |
          python3 scripts/u10-run.py --self-test
          python3 -m unittest discover -s tests/guests/u10/runner-tests -p 'test_*.py'
      - name: Build fixed unmodified static-musl guests and audit dependencies
        run: bash scripts/u10-build-guests.sh target/guests/u10
      - name: Observe fresh native expectations without network or node
        run: sudo unshare --net python3 scripts/u10-run.py --native-only --guest-dir target/guests/u10 --output target/u10/native
      - name: Retain build and native evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: u10-native-first
          path: |
            target/guests/u10/build-receipt.json
            target/guests/u10/*-build.log
            target/guests/u10/*-dependencies.log
            target/guests/u10/aube-deny.toml
            target/guests/u10/licenses/
            target/guests/u10/probe
            target/guests/u10/aube
            target/u10/native/
          retention-days: 7
