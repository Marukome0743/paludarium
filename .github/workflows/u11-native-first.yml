name: U11 native expectations before wasm changes
on:
  push:
    branches: [codex/u11-wasm-launcher]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-first:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake perl make pkg-config
      - run: rustup toolchain install nightly-2026-10-01 --profile minimal
      - run: rustup target add x86_64-unknown-linux-musl --toolchain nightly-2026-10-01
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0
        with:
          tool: cargo-deny
      - name: Runner readiness
        run: |
          python3 scripts/u11-run.py --self-test
          python3 -m unittest discover -s tests/guests/u11/runner-tests -p 'test_*.py'
      - name: Build fixed unmodified guests with all dependency checks
        run: bash scripts/u10-build-guests.sh target/guests/u10
      - name: Fresh native oracle before product implementation
        run: sudo unshare --net python3 scripts/u11-run.py --native-only --guest-dir target/guests/u10 --output target/u11/native
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: u11-native-first
          path: |
            target/guests/u10/build-receipt.json
            target/guests/u10/*-build.log
            target/guests/u10/*-dependencies.log
            target/guests/u10/aube-deny.toml
            target/guests/u10/licenses/
            target/guests/u10/probe
            target/guests/u10/aube
            target/u11/native/
          retention-days: 7
