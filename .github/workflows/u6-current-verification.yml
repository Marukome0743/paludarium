name: U6 current native coverage platforms and sanitizers
on:
  push:
    branches: [codex/u6-current-verification]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: nightly-2026-10-10
  CARGO_TERM_COLOR: never
jobs:
  native-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - name: Prepare fixed tools and input audit
        shell: bash
        run: |
          set -euo pipefail
          e=target/u6-current-evidence
          mkdir -p "$e"
          test "$(uname -m)" = x86_64
          uname -a > "$e/environment.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install nightly-2026-10-10 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup target add x86_64-unknown-linux-musl --toolchain nightly-2026-10-10
          compiler_bin="$(rustup which --toolchain nightly-2026-10-10 rustc | tr '\\' '/')"
          rustdoc_bin="$(rustup which --toolchain nightly-2026-10-10 rustdoc | tr '\\' '/')"
          compiler_dir="${compiler_bin%/*}"
          echo "$compiler_dir" >> "$GITHUB_PATH"
          echo "RUSTC=$compiler_bin" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_bin" >> "$GITHUB_ENV"
          "$compiler_bin" -Vv > "$e/compiler.txt"
          "$compiler_dir/cargo" -V > "$e/cargo.txt"
          "$compiler_dir/cargo" install --locked --version 0.9.1 cargo-llvm-cov
          cargo llvm-cov --version > "$e/llvm-cov.txt"
          python3 .github/scripts/u6-current-diagnostic.py snapshot "$e/source-before.sha256"
      - name: Fresh native differential all84
        shell: bash
        run: |
          set -euo pipefail
          e=target/u6-current-evidence
          set +e
          cargo build --locked -p paludarium 2>&1 | tee "$e/cli-build.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/cli-build-exit.txt"
          test "$status" = 0
          set +e
          cargo test --locked -p paludarium-harness --test diff_u6 -- --nocapture 2>&1 | tee "$e/diff.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/diff-exit.txt"
          test "$status" = 0
          for attempt in $(seq 1 10); do
            python3 scripts/u6-native-observe.py --case timer --guests target/guests/u6 --out "target/u6-repeat/$attempt" --emulator target/debug/paludarium
          done
          printf '0\n' > "$e/tokio-repeat-exit.txt"
          python3 .github/scripts/u6-current-diagnostic.py diff "$e/diff.log"
          printf '0\n' > "$e/diff-validation-exit.txt"
      - name: Original separate9-file Linux coverage
        shell: bash
        env:
          PALUDARIUM_U3_FULL_REPLAY: '1'
          PALUDARIUM_U3_NATIVE_OBSERVATIONS: ${{ github.workspace }}/target/u3-guests/observe.native
          PALUDARIUM_U3_NATIVE_FAULTS: ${{ github.workspace }}/target/u3-guests/fault-observe.native
          PALUDARIUM_U3_NATIVE_CPUID: ${{ github.workspace }}/target/u3-guests/cpuid-observe.native
        run: |
          set -euo pipefail
          e=target/u6-current-evidence
          bash tests/guests/u3/build.sh target/u3-guests
          python3 scripts/u5-coverage-native.py
          cp target/u3-guests/native-input-receipt.json "$e/coverage-native-input-receipt.json"
          cargo llvm-cov clean --workspace
          set +e
          cargo llvm-cov --locked --workspace --lib --lcov --output-path "$e/coverage.lcov" 2>&1 | tee "$e/coverage.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/coverage-exit.txt"
          test "$status" = 0
          cargo llvm-cov run --locked --no-report -p paludarium -- target/guests/u6/event-0
          printf '0\n' > "$e/coverage-cli-exit.txt"
          PALUDARIUM_U6_EMULATOR="$PWD/target/llvm-cov-target/debug/paludarium" cargo llvm-cov --locked --no-report -p paludarium-harness --test diff_u6 -- --nocapture
          printf '0\n' > "$e/coverage-diff-exit.txt"
          cargo llvm-cov report --lcov --output-path "$e/coverage.lcov"
          printf '0\n' > "$e/coverage-report-exit.txt"
          set +e
          python3 scripts/u6-coverage.py "$e/coverage.lcov" --out "$e/u6-coverage.json" 2>&1 | tee "$e/coverage-validation.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/coverage-validation-exit.txt"
          test "$status" = 0
          cargo llvm-cov report --locked --workspace --json --output-path "$e/coverage.json"
          printf '0\n' > "$e/coverage-json-exit.txt"
      - name: Audit unchanged inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e=target/u6-current-evidence
          python .github/scripts/u6-current-diagnostic.py snapshot "$e/source-after.sha256" --compare "$e/source-before.sha256"
          printf '0\n' > "$e/source-compare-exit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u6-current-native-coverage
          path: |
            target/u6-current-evidence/
            target/u6-diff/
            target/u6-repeat/
            fuzz/artifacts/
          retention-days: 7
  platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - name: Prepare actualcompiler and strict audit
        shell: bash
        run: |
          set -euo pipefail
          e=target/u6-current-evidence
          mkdir -p "$e"
          rustup toolchain install nightly-2026-10-10 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          compiler_bin="$(rustup which --toolchain nightly-2026-10-10 rustc | tr '\\' '/')"
          rustdoc_bin="$(rustup which --toolchain nightly-2026-10-10 rustdoc | tr '\\' '/')"
          compiler_dir="${compiler_bin%/*}"
          echo "$compiler_dir" >> "$GITHUB_PATH"
          echo "RUSTC=$compiler_bin" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_bin" >> "$GITHUB_ENV"
          "$compiler_bin" -Vv > "$e/compiler.txt"
          "$compiler_dir/cargo" -V > "$e/cargo.txt"
          python .github/scripts/u6-current-diagnostic.py snapshot "$e/source-before.sha256"
      - name: U6 exact49 and quality
        shell: bash
        run: |
          set -euo pipefail
          e=target/u6-current-evidence
          set +e
          cargo test --locked -p paludarium-kernel --lib u6_tests:: 2>&1 | tee "$e/lib.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/lib-exit.txt"
          test "$status" = 0
          python .github/scripts/u6-current-diagnostic.py lib "$e/lib.log"
          printf '0\n' > "$e/lib-validation-exit.txt"
          set +e
          cargo fmt --all -- --check 2>&1 | tee "$e/fmt.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/fmt-exit.txt"
          test "$status" = 0
          set +e
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee "$e/clippy.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/clippy-exit.txt"
          test "$status" = 0
          cargo install --locked --version 0.20.2 cargo-deny
          cargo deny --version > "$e/deny-version.txt"
          set +e
          cargo deny check advisories 2>&1 | tee "$e/deny-advisories.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/deny-advisories-exit.txt"
          test "$status" = 0
          set +e
          cargo deny check bans 2>&1 | tee "$e/deny-bans.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/deny-bans-exit.txt"
          test "$status" = 0
          set +e
          cargo deny check licenses 2>&1 | tee "$e/deny-licenses.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/deny-licenses-exit.txt"
          test "$status" = 0
          set +e
          cargo deny check sources 2>&1 | tee "$e/deny-sources.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/deny-sources-exit.txt"
          test "$status" = 0
      - name: Audit unchanged inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e=target/u6-current-evidence
          python .github/scripts/u6-current-diagnostic.py snapshot "$e/source-after.sha256" --compare "$e/source-before.sha256"
          printf '0\n' > "$e/source-compare-exit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u6-current-platform-${{ matrix.os }}
          path: |
            target/u6-current-evidence/
            target/u6-diff/
            target/u6-repeat/
            fuzz/artifacts/
          retention-days: 7
  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [kernel_events_u6, kernel_sockets_u6]
    container:
      image: rust:1-bookworm
      options: --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined --ulimit=stack=-1
    env:
      ASAN_OPTIONS: detect_leaks=1
      LSAN_OPTIONS: suppressions=/work/fuzz/lsan.supp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - name: Actualcompiler and complete input binding
        shell: bash
        run: |
          set -euo pipefail
          e=target/u6-current-evidence
          mkdir -p "$e"
          apt-get update
          apt-get install -y --no-install-recommends python3 python-is-python3 binutils
          ln -s "$GITHUB_WORKSPACE" /work
          rustup toolchain install nightly-2026-10-10 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          compiler_bin="$(rustup which --toolchain nightly-2026-10-10 rustc | tr '\\' '/')"
          rustdoc_bin="$(rustup which --toolchain nightly-2026-10-10 rustdoc | tr '\\' '/')"
          compiler_dir="${compiler_bin%/*}"
          echo "$compiler_dir" >> "$GITHUB_PATH"
          echo "RUSTC=$compiler_bin" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_bin" >> "$GITHUB_ENV"
          "$compiler_bin" -Vv > "$e/compiler.txt"
          "$compiler_dir/cargo" -V > "$e/cargo.txt"
          "$compiler_dir/cargo" install --locked --version 0.13.2 cargo-fuzz
          cargo fuzz --version > "$e/fuzz-version.txt"
          python .github/scripts/u6-current-diagnostic.py snapshot "$e/source-before.sha256"
      - name: Current locked build and600secs ASanLSan
        shell: bash
        run: |
          set -euo pipefail
          cd /work
          e=target/u6-current-evidence
          set +e
          cargo check --locked --manifest-path fuzz/Cargo.toml --bins 2>&1 | tee "$e/fuzz-check.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/fuzz-check-exit.txt"
          test "$status" = 0
          printf 'ASAN_OPTIONS=%s\nLSAN_OPTIONS=%s\nseed=1\ntimeout=30\nrss_limit_mb=2048\nmax_total_time=600\nsan=address\n' "$ASAN_OPTIONS" "$LSAN_OPTIONS" > "$e/settings.txt"
          sha256sum fuzz/lsan.supp > "$e/suppression.sha256"
          date -u +%FT%TZ > "$e/start.txt"
          set +e
          cargo fuzz run --fuzz-dir fuzz --sanitizer address '${{ matrix.target }}' -- -seed=1 -max_total_time=600 -timeout=30 -rss_limit_mb=2048 2>&1 | tee "$e/fuzz.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/fuzz-exit.txt"
          test "$status" = 0
          date -u +%FT%TZ > "$e/end.txt"
          binary="fuzz/target/x86_64-unknown-linux-gnu/release/${{ matrix.target }}"
          sha256sum "$binary" > "$e/binary.sha256"
          nm -a "$binary" > "$e/symbols.txt"
          grep -q __asan_init "$e/symbols.txt"
          grep -q __lsan "$e/symbols.txt"
          printf '0\n' > "$e/instrumentation-exit.txt"
      - name: Audit unchanged inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e=target/u6-current-evidence
          python .github/scripts/u6-current-diagnostic.py snapshot "$e/source-after.sha256" --compare "$e/source-before.sha256"
          printf '0\n' > "$e/source-compare-exit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u6-current-sanitizer-${{ matrix.target }}
          path: |
            target/u6-current-evidence/
            target/u6-diff/
            target/u6-repeat/
            fuzz/artifacts/
          retention-days: 7
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Current production wasm and all Node cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/u6-production-evidence
          e=target/u6-production-evidence
          exec > >(tee "$e/raw.log") 2>&1
          rustup toolchain install nightly-2026-10-10 --profile minimal --component rust-src --target wasm32-unknown-unknown
          compiler_bin="$(rustup which --toolchain nightly-2026-10-10 rustc | tr '\\\\' '/')"
          rustdoc_bin="$(rustup which --toolchain nightly-2026-10-10 rustdoc | tr '\\\\' '/')"
          export RUSTC="$compiler_bin" RUSTDOC="$rustdoc_bin"
          export PATH="${compiler_bin%/*}:$PATH"
          "$RUSTC" -Vv > "$e/compiler.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl --toolchain nightly-2026-10-10
          curl -fsSLO https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          curl -fsSLO https://nodejs.org/dist/v26.11.1/SHASUMS256.txt
          sha256sum --check --ignore-missing SHASUMS256.txt
          tar -xf node-v26.11.1-linux-x64.tar.xz
          export PATH="$PWD/node-v26.11.1-linux-x64/bin:$PATH"
          node --version
          python3 .github/scripts/u6-current-diagnostic.py snapshot "$e/source-before.sha256"
          python3 packages/paludarium-wasm/tests/generate-guests.py --check
          python3 scripts/wasm-native-guests.py > "$e/base-native.json"
          bash tests/guests/u6/build.sh target/guests/u6
          python3 scripts/u6-native-observe.py --out "$e/u6-native"
          python3 scripts/u6-wasm-guests.py --base-native "$e/base-native.json" --observations "$e/u6-native" --guests target/guests/u6 --destination packages/paludarium-wasm/tests/guests --out "$e/native-results.json"
          export RUSTFLAGS='-C target-feature=+atomics,+bulk-memory,+mutable-globals -C link-arg=--import-memory -C link-arg=--shared-memory -C link-arg=--max-memory=1073741824 -C link-arg=--export=__stack_pointer -C link-arg=--export=__wasm_init_tls -C link-arg=--export=__tls_size -C link-arg=--export=__tls_align -C link-arg=--export=__tls_base'
          cargo build --locked -Z build-std=std,panic_abort --release --target wasm32-unknown-unknown -p paludarium-wasm
          cp target/wasm32-unknown-unknown/release/paludarium_wasm.wasm packages/paludarium-wasm/paludarium.wasm
          sha256sum packages/paludarium-wasm/paludarium.wasm "$e/native-results.json" > "$e/module-native.sha256"
          node --test packages/paludarium-wasm/tests/import-check.mjs
          set +e
          node packages/paludarium-wasm/tests/u6-check.mjs --wasm packages/paludarium-wasm/paludarium.wasm --native "$e/native-results.json" > "$e/node-report.json" 2> "$e/node.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$e/node-exit.txt"
          cat "$e/node-report.json"
          test "$status" = 0
          python3 .github/scripts/u6-current-diagnostic.py browser "$e/node-report.json"
          cp packages/paludarium-wasm/paludarium.wasm "$e/"
      - name: Production source unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e=target/u6-production-evidence
          python3 .github/scripts/u6-current-diagnostic.py snapshot "$e/source-after.sha256"
          python3 .github/scripts/u6-current-diagnostic.py snapshot "$e/source-after.sha256" --compare "$e/source-before.sha256"
          printf '0\n' > "$e/source-compare-exit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u6-current-production
          path: |
            target/u6-production-evidence/
            packages/paludarium-wasm/tests/guests/u6-*
          retention-days: 7
  safari:
    needs: production
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: u6-current-production
          path: target/u6-production-evidence
      - name: Real Safari same module and fresh native expectations
        shell: bash
        run: |
          set -euo pipefail
          e=target/u6-safari-evidence
          mkdir -p "$e"
          python3 .github/scripts/u6-current-diagnostic.py snapshot "$e/source-before.sha256"
          cp -R target/u6-production-evidence/target/u6-production-evidence/. target/u6-production-evidence/
          cp target/u6-production-evidence/paludarium.wasm packages/paludarium-wasm/paludarium.wasm
          arch=$(uname -m)
          if [ "$arch" = arm64 ]; then node_arch=arm64; else node_arch=x64; fi
          export NODE_ARCHIVE="node-v26.11.1-darwin-${node_arch}.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/v26.11.1/$NODE_ARCHIVE"
          curl -fsSLO https://nodejs.org/dist/v26.11.1/SHASUMS256.txt
          python3 - <<'PY'
          import os, hashlib, pathlib
          p=pathlib.Path(os.environ["NODE_ARCHIVE"])
          expected=next(line.split()[0] for line in pathlib.Path("SHASUMS256.txt").read_text().splitlines() if line.split()[-1]==p.name)
          assert hashlib.sha256(p.read_bytes()).hexdigest()==expected
          PY
          tar -xf "$NODE_ARCHIVE"
          export PATH="$PWD/node-v26.11.1-darwin-${node_arch}/bin:$PATH"
          node --version > "$e/environment.log"
          /usr/bin/safaridriver --version >> "$e/environment.log"
          sw_vers >> "$e/environment.log"
          cp -R target/u6-production-evidence/packages/paludarium-wasm/tests/guests/u6-* packages/paludarium-wasm/tests/guests/
          shasum -a 256 -c target/u6-production-evidence/target/u6-production-evidence/module-native.sha256
          shasum -a 256 packages/paludarium-wasm/paludarium.wasm target/u6-production-evidence/native-results.json > "$e/module-native.sha256"
          sudo /usr/bin/safaridriver --enable
          export SAFARI_STATIC_ROOT="$PWD"
          export SAFARI_ENTRY_PATH='/packages/paludarium-wasm/tests/index.html?wasm=/packages/paludarium-wasm/paludarium.wasm&native=/target/u6-production-evidence/native-results.json'
          export SAFARI_REPORT_KEY=__paludariumProductionReport
          python3 - <<'PY'
          import os, signal, subprocess, pathlib
          e=pathlib.Path("target/u6-safari-evidence")
          p=subprocess.Popen(["node",".github/scripts/u9-safari-diagnostic.mjs"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)
          try:
              stdout,stderr=p.communicate(timeout=30)
          except subprocess.TimeoutExpired:
              os.killpg(p.pid,signal.SIGKILL)
              stdout,stderr=p.communicate()
              (e/"timeout.txt").write_text("30 second whole-process watchdog\n")
          (e/"safari-report.json").write_bytes(stdout)
          (e/"safari.stderr").write_bytes(stderr)
          (e/"exit.txt").write_text(str(p.returncode)+"\n")
          assert p.returncode==0
          PY
          cat "$e/safari-report.json"
          python3 - <<'PY'
          import json
          x=json.load(open("target/u6-safari-evidence/safari-report.json"))
          n=json.load(open("target/u6-production-evidence/node-report.json"))
          assert x["caseCount"]==102
          assert x["pass"] and x["crossOriginIsolated"] and x["productionLauncher"] and x["sharedMemory"]
          assert x["caseCount"]==n["caseCount"] and [r["case"] for r in x["results"]]==[r["case"] for r in n["results"]]
          assert all(r["pass"] for r in x["results"]) and x["elapsed_ms"]<30000
          assert x["cleanup"]["driver_reaped"] and x["cleanup"]["server_closed"]
          PY
      - name: Safari source unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e=target/u6-safari-evidence
          python3 .github/scripts/u6-current-diagnostic.py snapshot "$e/source-after.sha256" --compare "$e/source-before.sha256"
          printf '0\n' > "$e/source-compare-exit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u6-current-safari
          path: target/u6-safari-evidence/
          retention-days: 7


