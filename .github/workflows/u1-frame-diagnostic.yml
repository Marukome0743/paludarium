name: U1 saved native frame investigation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  saved-native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install and record distribution diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gdb binutils
          apt-cache policy gdb binutils
          python3 --version
      - name: Retrieve exact initial artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Marukome0743/paludarium/actions/artifacts/11714208388/zip > initial-frame.zip
      - name: Bounded original ELF diagnostics
        run: python3 -B scripts/u1-frame-diagnostic.py initial-frame.zip frame-diagnostic --runs 50
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u1-saved-native-frame-diagnostic
          path: frame-diagnostic/
          if-no-files-found: error
