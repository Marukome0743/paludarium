name: U2 clone flag diagnostic
on:
  push:
    branches: [codex/u2-asan-diagnostic]
permissions:
  contents: read
jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: rust:1-bookworm
      options: --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined --ulimit=stack=-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare clone flags and sanitizer exit
        run: bash diagnostics/u2-clone/run.sh target/u2-clone-evidence
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: u2-clone-native
          path: target/u2-clone-evidence/
          retention-days: 7
  guests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Execute actual guest ELF on native x86-64 Linux
        run: |
          mkdir -p target/u2-native-guests
          uname -a > target/u2-native-guests/environment.log
          python3 diagnostics/u2-clone/native-guests.py > target/u2-native-guests/results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: u2-native-guests
          path: target/u2-native-guests/
          retention-days: 7
# Step44: regenerate native expectations before production wasm semantics.
