# Pull-request gate (team.md Testing Posture, Q7): unit tests on Linux,
# macOS and Windows, fmt, clippy (-D warnings), dependency checks, the
# x86-64 Linux differential tests and the 80% line-coverage floor.
# Every job must pass before merging. Actions are pinned by commit SHA and
# the default token is read-only (NFR8.2).
name: U13 current full quality

on:
  workflow_dispatch:
  push:
    branches: [codex/u13-windows-host]

permissions:
  contents: read

concurrency:
  group: u13-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The U1 crates (unit-test-instructions.md).
  U1_PACKAGES: >-
    -p paludarium-types -p paludarium-decoder -p paludarium-mmu
    -p paludarium-cpu -p paludarium-loader -p paludarium-vfs
    -p paludarium-kernel -p paludarium-host -p paludarium-jit
    -p paludarium-runtime -p paludarium

defaults:
  run:
    shell: bash

jobs:
  u13-oracle:
    uses: ./.github/workflows/u13-native-first.yml
  windows-host:
    needs: u13-oracle
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: u13-native-first
          path: target
      - run: python3 -m pip install 'coverage==7.16.2'
      - name: Python comparison boundary regressions and defined coverage scope
        run: python3 -m coverage run --data-file=target/u13-python.coverage --include='tests/guests/u13/settings.py,tests/guests/u13/oracle.py,tests/guests/u13/host_comparison.py,tests/guests/u13/fixture.py,tests/guests/u13/operation.py,tests/guests/u13/runner.py,tests/guests/u13/windows_job.py' -m unittest discover -s tests/guests/u13/runner-tests -p 'test_*.py'
      - run: rustup toolchain install nightly-2026-10-11 --profile minimal --component llvm-tools-preview
      - name: Compile and lint the Windows configuration, including actual FFI and tests
        run: cargo clippy --locked -p paludarium-host -p paludarium-harness --all-targets -- -D warnings
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Record actual inputs and run native Host boundaries
        run: |
          mkdir -p target/u13/windows
          rustc -Vv > target/u13/windows/compiler.txt
          shasum -a 256 Cargo.lock fuzz/Cargo.lock rust-toolchain.toml > target/u13/windows/inputs-before.sha256
          cargo llvm-cov clean --workspace
          cargo llvm-cov test --no-report --locked -p paludarium-host --lib -- --test-threads=1
      - name: Same fixed bytes through Windows emulator, instrumented
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo test --locked -p paludarium-harness --test diff_u13 --no-run --message-format=json > target/u13/windows/build.jsonl
          python3 - <<'PY'
          import json, pathlib, subprocess
          rows = [json.loads(line) for line in pathlib.Path('target/u13/windows/build.jsonl').read_text().splitlines()]
          binaries = [row['executable'] for row in rows if row.get('reason') == 'compiler-artifact' and row.get('target', {}).get('name') == 'diff_u13' and row.get('executable')]
          if len(binaries) != 1:
              raise RuntimeError('expected exactly one U13 harness executable')
          subprocess.run(['python3', '-m', 'coverage', 'run', '--append', '--data-file=target/u13-python.coverage', '--include=tests/guests/u13/settings.py,tests/guests/u13/oracle.py,tests/guests/u13/host_comparison.py,tests/guests/u13/fixture.py,tests/guests/u13/operation.py,tests/guests/u13/runner.py,tests/guests/u13/windows_job.py', 'scripts/u13-run.py', '--guests', 'target/guests/u10', '--native-report', 'target/u13/native/observations.json', '--output', 'target/u13/windows/comparison', '--emulator', binaries[0]], check=True)
          subprocess.run(['python3', '-m', 'coverage', 'run', '--append', '--data-file=target/u13-python.coverage', '--include=tests/guests/u13/settings.py,tests/guests/u13/oracle.py,tests/guests/u13/host_comparison.py,tests/guests/u13/fixture.py,tests/guests/u13/operation.py,tests/guests/u13/runner.py,tests/guests/u13/windows_job.py', 'scripts/u13-run.py', '--original-argv', '--guests', 'target/guests/u10', '--native-report', 'target/u13/native-original/observations.json', '--output', 'target/u13/windows/comparison-original', '--emulator', binaries[0]], check=True)
          PY
          python3 -m coverage json --data-file=target/u13-python.coverage -o target/u13/windows/python-coverage.json
          python3 -m coverage report --data-file=target/u13-python.coverage --fail-under=80
      - name: Fixed native Host coverage and separate Windows code floor
        run: |
          cargo llvm-cov report --json --output-path target/u13/windows/coverage.json
          python3 - <<'PY'
          import json, pathlib
          expected = {'lib.rs', 'clock.rs', 'threads.rs', 'native_fs.rs', 'fs.rs', 'windows.rs'}
          data = json.loads(pathlib.Path('target/u13/windows/coverage.json').read_text())
          files = [row for row in data['data'][0]['files'] if '/paludarium-host/src/' in row['filename'] and pathlib.Path(row['filename']).name in expected]
          if {pathlib.Path(row['filename']).name for row in files} != expected:
              raise RuntimeError('coverage denominator missing a native Host file')
          lines = sum(row['summary']['lines']['count'] for row in files)
          covered = sum(row['summary']['lines']['covered'] for row in files)
          result = {'files': sorted(expected), 'lines': lines, 'covered': covered, 'percent': 100 * covered / lines if lines else 0}
          pathlib.Path('target/u13/windows/coverage-scope.json').write_text(json.dumps(result, indent=2) + '\n')
          if not lines or covered / lines < .8:
              raise RuntimeError('native Host coverage below eighty percent')
          common = [row for row in files if pathlib.Path(row['filename']).name != 'windows.rs']
          common_lines = sum(row['summary']['lines']['count'] for row in common)
          common_covered = sum(row['summary']['lines']['covered'] for row in common)
          if not common_lines or common_covered / common_lines < .8:
              raise RuntimeError('five-file common Host coverage below eighty percent')
          pathlib.Path('target/u13/windows/coverage-common.json').write_text(json.dumps({'files': sorted(expected - {'windows.rs'}), 'lines': common_lines, 'covered': common_covered, 'percent': 100 * common_covered / common_lines}, indent=2) + '\n')
          windows = [row for row in files if pathlib.Path(row['filename']).name == 'windows.rs']
          if len(windows) != 1 or not windows[0]['summary']['lines']['count'] or windows[0]['summary']['lines']['percent'] < 80:
              raise RuntimeError('Windows implementation coverage below eighty percent')
          pathlib.Path('target/u13/windows/coverage-windows.json').write_text(json.dumps(windows[0]['summary']['lines'], indent=2) + '\n')
          PY
          shasum -a 256 Cargo.lock fuzz/Cargo.lock rust-toolchain.toml > target/u13/windows/inputs-after.sha256
          cmp target/u13/windows/inputs-before.sha256 target/u13/windows/inputs-after.sha256
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u13-windows-host
          path: target/u13/windows
          retention-days: 14
  u11-programs:
    uses: ./.github/workflows/u13-wasm-acceptance.yml
  u13-fuzz:
    uses: ./.github/workflows/u12-fuzz.yml
  u10-programs:
    name: U10 fixed guests and fresh native differential
    uses: ./.github/workflows/u10-native-diagnostic.yml

  production-wasm:
    name: production wasm (shared Rust heap, nested Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.11.1'
      - run: rustup component add rust-src --toolchain nightly-2026-10-11
      - name: Generate and execute fresh native fixtures
        run: |
          mkdir -p target/production-wasm-evidence
          python3 packages/paludarium-wasm/tests/generate-guests.py --check
          python3 scripts/wasm-native-guests.py > target/production-wasm-evidence/native-results.json
      - name: Build actual production Session module
        run: bash scripts/build-wasm.sh
      - name: Compare production wasm with native results
        run: |
          node --test packages/paludarium-wasm/tests/import-check.mjs
          node packages/paludarium-wasm/tests/node-check.mjs packages/paludarium-wasm/paludarium.wasm target/production-wasm-evidence/native-results.json > target/production-wasm-evidence/node-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: production-wasm-evidence
          path: |
            target/production-wasm-evidence/
            packages/paludarium-wasm/paludarium.wasm
          retention-days: 7
  test:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the toolchain pinned in rust-toolchain.toml (NFR9.1).
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Unit tests (U1 crates)
        shell: bash
        run: |
          read -r -a packages <<< "$U1_PACKAGES"
          cargo test --locked "${packages[@]}" -- --nocapture
        env:
          RUST_BACKTRACE: "1"
      - name: Harness unit tests
        run: cargo test --locked -p paludarium-harness --lib

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: |
          cargo fmt --all --check
          cargo fmt --check --manifest-path fuzz/Cargo.toml
          cargo fmt --check --manifest-path tests/guests/hello-rs/Cargo.toml
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: decoder builds for wasm32
        run: cargo build --locked -p paludarium-decoder -p paludarium-mmu -p paludarium-cpu --target wasm32-unknown-unknown

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.24
        with:
          tool: cargo-deny
      # Licenses compatible with Apache-2.0, crates.io only, RustSec,
      # forbidden crates (NFR8.1, NFR8.4).
      - run: cargo deny --locked check

  differential:
    name: differential tests (x86-64 Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Record native architectural profile
        run: |
          mkdir -p target/u3-guests
          uname -a > target/u3-guests/uname.txt
          lscpu > target/u3-guests/cpu.txt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Builds the guests from source (BR7.2), runs each natively and under
      # the emulator, compares stdout/stderr/exit status (BR7.1) and prints
      # the run times (NFR6.1).
      - run: cargo test --locked -p paludarium-harness --test diff_u1 --test diff_u2 --test parallel_u2 --test diff_u4 --test diff_u9 --test diff_u3 --test diff_u8 -- --nocapture
      - name: Retain fresh U3 architectural observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u3-differential-observations
          path: target/u3-guests/
          retention-days: 7

  coverage:
    name: line coverage >= 80%
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PALUDARIUM_U3_FULL_REPLAY: '1'
      PALUDARIUM_U3_NATIVE_OBSERVATIONS: ${{ github.workspace }}/target/u3-guests/observe.native
      PALUDARIUM_U3_NATIVE_FAULTS: ${{ github.workspace }}/target/u3-guests/fault-observe.native
      PALUDARIUM_U3_NATIVE_CPUID: ${{ github.workspace }}/target/u3-guests/cpuid-observe.native
      PALUDARIUM_U5_EMULATOR: ${{ github.workspace }}/target/llvm-cov-target/debug/paludarium
      PALUDARIUM_U6_EMULATOR: ${{ github.workspace }}/target/llvm-cov-target/debug/paludarium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Record native architectural profile
        run: |
          mkdir -p target/u3-guests
          uname -a > target/u3-guests/uname.txt
          lscpu > target/u3-guests/cpu.txt
      - name: Generate fresh U3 native inputs before instrumented library tests
        shell: bash
        run: |
          bash tests/guests/u3/build.sh target/u3-guests
          python3 - <<'PY_NATIVE'
          from pathlib import Path
          import subprocess, os, signal, json, hashlib
          out=Path('target/u3-guests')
          rows=[]
          for name, expected_rows in [('observe',23576),('fault-observe',1162),('cpuid-observe',12)]:
              binary=out/name
              with (out/(name+'.native')).open('wb') as stdout, (out/(name+'.stderr')).open('wb') as stderr:
                  child=subprocess.Popen([str(binary.resolve())], stdout=stdout, stderr=stderr, start_new_session=True)
                  try:
                      code=child.wait(timeout=30)
                  except subprocess.TimeoutExpired:
                      os.killpg(child.pid,signal.SIGKILL)
                      child.wait()
                      raise
              data=(out/(name+'.native')).read_bytes()
              rows.append({'name':name,'exit':code,'rows':len(data.splitlines()),'binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'output_sha256':hashlib.sha256(data).hexdigest()})
              (out/'native-input-receipt.json').write_text(json.dumps(rows,indent=2)+'\n')
              assert code==0 and len(data.splitlines())==expected_rows and not (out/(name+'.stderr')).read_bytes()
          PY_NATIVE
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.24
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # NFR3.3: fails below 80% of lines. The floor is never lowered.
      - name: Workspace line coverage >= 80%
        run: |
          cargo llvm-cov clean --workspace
          (
            # shellcheck disable=SC1090
            source <(cargo llvm-cov show-env --sh)
            cargo build --locked -p paludarium --target-dir target/llvm-cov-target
          )
          cargo llvm-cov --no-clean --locked --workspace --fail-under-lines 80
        env:
          # Instrumented independent cases run serially; race cases still
          # launch their own host workers and retain the 30-second watchdog.
          RUST_TEST_THREADS: "1"
      - name: U11 changed Rust components line coverage >= 80%
        run: |
          cargo llvm-cov --locked -p paludarium-host -p paludarium-vfs -p paludarium-kernel -p paludarium-runtime -p paludarium-wasm --lib --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|jit)/' --fail-under-lines 80 --lcov --output-path target/u11-coverage.lcov
      - name: Retain U11 coverage observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u11-coverage-lcov
          path: target/u11-coverage.lcov
      - name: U1 package line coverage >= 80%
        # Keep the same U1 production file set; fresh architectural tests live
        # in Harness and must execute when measuring the newly shared CPU code.
        run: |
          cargo llvm-cov clean --workspace
          (
            # shellcheck disable=SC1090
            source <(cargo llvm-cov show-env --sh)
            cargo build --locked -p paludarium --target-dir target/llvm-cov-target
          )
          read -r -a packages <<< "$U1_PACKAGES"
          cargo llvm-cov --no-clean --locked "${packages[@]}" -p paludarium-harness --ignore-filename-regex 'paludarium-harness/' --fail-under-lines 80
        env:
          RUST_TEST_THREADS: "1"

      - name: U9 target crates line coverage >= 80%
        run: |
          cargo llvm-cov --locked -p paludarium-host -p paludarium-kernel -p paludarium-runtime -p paludarium -p paludarium-harness --lib --test diff_u9 --test command --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|vfs|jit|harness)/' --fail-under-lines 80 --lcov --output-path target/u9-coverage.lcov
          cargo llvm-cov report --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|vfs|jit|harness)/'
        env:
          RUST_TEST_THREADS: "1"
      - name: U3 CPU and Decoder line coverage >= 80%
        run: |
          cargo llvm-cov --locked -p paludarium-cpu -p paludarium-decoder -p paludarium-harness --lib --test diff_u3 --ignore-filename-regex 'paludarium-(types|mmu|host|kernel|loader|vfs|jit|runtime|harness)/' --fail-under-lines 80 --lcov --output-path target/u3-coverage.lcov
          cargo llvm-cov report --ignore-filename-regex 'paludarium-(types|mmu|host|kernel|loader|vfs|jit|runtime|harness)/'
        env:
          RUST_TEST_THREADS: "1"
      - name: Retain U3 coverage observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u3-coverage-lcov
          path: target/u3-coverage.lcov
          retention-days: 7
      - name: Retain native states even when coverage fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u3-coverage-native-observations
          path: target/u3-guests/
          retention-days: 7
      - name: Retain U9 coverage line observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u9-coverage-lcov
          path: target/u9-coverage.lcov
          retention-days: 7
