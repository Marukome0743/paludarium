name: U8 current native workspace coverage and platforms
on:
  push:
    branches: [codex/u8-current-verification]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: nightly-2026-10-10
  CARGO_TERM_COLOR: never
jobs:
  native-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - name: Prepare fixed tools and input audit
        shell: bash
        run: |
          set -euo pipefail
          e=target/u8-current-evidence
          mkdir -p "$e"
          test "$(uname -m)" = x86_64
          uname -a > "$e/environment.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install nightly-2026-10-10 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup target add --toolchain nightly-2026-10-10 x86_64-unknown-linux-musl
          compiler_bin="$(rustup which --toolchain nightly-2026-10-10 rustc | tr '\\' '/')"
          rustdoc_bin="$(rustup which --toolchain nightly-2026-10-10 rustdoc | tr '\\' '/')"
          compiler_dir="${compiler_bin%/*}"
          echo "$compiler_dir" >> "$GITHUB_PATH"
          echo "RUSTC=$compiler_bin" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_bin" >> "$GITHUB_ENV"
          "$compiler_bin" -Vv > "$e/compiler.txt"
          "$compiler_dir/cargo" -V > "$e/cargo.txt"
          "$compiler_dir/cargo" install --locked --version 0.9.1 cargo-llvm-cov
          cargo llvm-cov --version > "$e/llvm-cov.txt"
          python3 .github/scripts/u8-current-diagnostic.py snapshot "$e/source-before.sha256"
      - name: Fresh native differential all29 plusrunner
        shell: bash
        run: |
          set -euo pipefail
          e=target/u8-current-evidence
          set +e
          cargo build --locked -p paludarium 2>&1 | tee "$e/cli-build.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/cli-build-exit.txt"
          test "$status" = 0
          set +e
          cargo test --locked -p paludarium-harness --test diff_u8 -- --nocapture 2>&1 | tee "$e/diff.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/diff-exit.txt"
          test "$status" = 0
          python3 .github/scripts/u8-current-diagnostic.py diff "$e/diff.log"
          printf '0\n' > "$e/diff-validation-exit.txt"
      - name: Original workspace population Linux coverage
        shell: bash
        env:
          PALUDARIUM_U3_FULL_REPLAY: '1'
          PALUDARIUM_U3_NATIVE_OBSERVATIONS: ${{ github.workspace }}/target/u3-guests/observe.native
          PALUDARIUM_U3_NATIVE_FAULTS: ${{ github.workspace }}/target/u3-guests/fault-observe.native
          PALUDARIUM_U3_NATIVE_CPUID: ${{ github.workspace }}/target/u3-guests/cpuid-observe.native
        run: |
          set -euo pipefail
          e=target/u8-current-evidence
          bash tests/guests/u3/build.sh target/u3-guests
          python3 scripts/u5-coverage-native.py
          cp target/u3-guests/native-input-receipt.json "$e/coverage-native-input-receipt.json"
          cargo llvm-cov clean --workspace
          (
            source <(cargo llvm-cov show-env --sh)
            cargo build --locked -p paludarium --target-dir target/llvm-cov-target
          )
          export PALUDARIUM_U5_EMULATOR="$GITHUB_WORKSPACE/target/llvm-cov-target/debug/paludarium"
          export PALUDARIUM_U6_EMULATOR="$GITHUB_WORKSPACE/target/llvm-cov-target/debug/paludarium"
          export RUST_TEST_THREADS=1
          set +e
          cargo llvm-cov --no-clean --locked --workspace --fail-under-lines 80 2>&1 | tee "$e/coverage.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/coverage-exit.txt"
          test "$status" = 0
          cargo llvm-cov report --locked --workspace --lcov --output-path "$e/coverage.lcov"
          cargo llvm-cov report --locked --workspace --json --output-path "$e/coverage.json"
          printf '0\n' > "$e/coverage-report-exit.txt"
      - name: Audit unchanged inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e=target/u8-current-evidence
          python .github/scripts/u8-current-diagnostic.py snapshot "$e/source-after.sha256" --compare "$e/source-before.sha256"
          printf '0\n' > "$e/source-compare-exit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u8-current-native-coverage
          path: |
            target/u8-current-evidence/
            target/u5-diff/
            target/u6-diff/
            target/guests/u8/
            target/u3-guests/
            fuzz/artifacts/
          retention-days: 7
  platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - name: Prepare actualcompiler and strict audit
        shell: bash
        run: |
          set -euo pipefail
          e=target/u8-current-evidence
          mkdir -p "$e"
          rustup toolchain install nightly-2026-10-10 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          compiler_bin="$(rustup which --toolchain nightly-2026-10-10 rustc | tr '\\' '/')"
          rustdoc_bin="$(rustup which --toolchain nightly-2026-10-10 rustdoc | tr '\\' '/')"
          compiler_dir="${compiler_bin%/*}"
          echo "$compiler_dir" >> "$GITHUB_PATH"
          echo "RUSTC=$compiler_bin" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_bin" >> "$GITHUB_ENV"
          "$compiler_bin" -Vv > "$e/compiler.txt"
          "$compiler_dir/cargo" -V > "$e/cargo.txt"
          python .github/scripts/u8-current-diagnostic.py snapshot "$e/source-before.sha256"
      - name: U8 exact56 plusrelated and quality
        shell: bash
        run: |
          set -euo pipefail
          e=target/u8-current-evidence
          set +e
          cargo test --locked -p paludarium-kernel -p paludarium-runtime -p paludarium-mmu --lib u8_ 2>&1 | tee "$e/lib.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/lib-exit.txt"
          test "$status" = 0
          python .github/scripts/u8-current-diagnostic.py lib "$e/lib.log" --unit u8
          set +e
          cargo test --locked -p paludarium-kernel -p paludarium-runtime --lib u5_tests:: 2>&1 | tee "$e/u5-lib.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/u5-lib-exit.txt"
          test "$status" = 0
          python .github/scripts/u8-current-diagnostic.py lib "$e/u5-lib.log" --unit u5
          set +e
          cargo test --locked -p paludarium-kernel --lib u6_tests:: 2>&1 | tee "$e/u6-lib.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/u6-lib-exit.txt"
          test "$status" = 0
          python .github/scripts/u8-current-diagnostic.py lib "$e/u6-lib.log" --unit u6
          set +e
          cargo fmt --all -- --check 2>&1 | tee "$e/fmt.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/fmt-exit.txt"
          test "$status" = 0
          set +e
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee "$e/clippy.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/clippy-exit.txt"
          test "$status" = 0
          cargo install --locked --version 0.20.2 cargo-deny
          cargo deny --version > "$e/deny-version.txt"
          set +e
          cargo deny check advisories 2>&1 | tee "$e/deny-advisories.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/deny-advisories-exit.txt"
          test "$status" = 0
          set +e
          cargo deny check bans 2>&1 | tee "$e/deny-bans.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/deny-bans-exit.txt"
          test "$status" = 0
          set +e
          cargo deny check licenses 2>&1 | tee "$e/deny-licenses.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/deny-licenses-exit.txt"
          test "$status" = 0
          set +e
          cargo deny check sources 2>&1 | tee "$e/deny-sources.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/deny-sources-exit.txt"
          test "$status" = 0
      - name: Audit unchanged inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e=target/u8-current-evidence
          python .github/scripts/u8-current-diagnostic.py snapshot "$e/source-after.sha256" --compare "$e/source-before.sha256"
          printf '0\n' > "$e/source-compare-exit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u8-current-platform-${{ matrix.os }}
          path: |
            target/u8-current-evidence/
            target/u5-diff/
            target/u6-diff/
            target/guests/u8/
            target/u3-guests/
            fuzz/artifacts/
          retention-days: 7
