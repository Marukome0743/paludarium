name: U10 current fixed guests native differential coverage platforms
on:
  push:
    branches: [codex/u10-current-verification]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: nightly-2026-10-10
  CARGO_TERM_COLOR: never
jobs:
  native-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - name: Prepare fixed tools and input audit
        shell: bash
        run: |
          set -euo pipefail
          e=target/u10-current-evidence
          mkdir -p "$e"
          test "$(uname -m)" = x86_64
          uname -a > "$e/environment.txt"
          python3 --version > "$e/python-host-version.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install nightly-2026-10-10 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup target add --toolchain nightly-2026-10-10 x86_64-unknown-linux-musl
          compiler_bin="$(rustup which --toolchain nightly-2026-10-10 rustc | tr '\\' '/')"
          rustdoc_bin="$(rustup which --toolchain nightly-2026-10-10 rustdoc | tr '\\' '/')"
          compiler_dir="${compiler_bin%/*}"
          echo "$compiler_dir" >> "$GITHUB_PATH"
          echo "RUSTC=$compiler_bin" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_bin" >> "$GITHUB_ENV"
          "$compiler_bin" -Vv > "$e/compiler.txt"
          "$compiler_dir/cargo" -V > "$e/cargo.txt"
          "$compiler_dir/cargo" install --locked --version 0.9.1 cargo-llvm-cov
          cargo llvm-cov --version > "$e/llvm-cov.txt"
          python3 .github/scripts/u10-current-diagnostic.py snapshot "$e/source-before.sha256"
      - name: Fresh fixed guests and native before differential
        shell: bash
        run: |
          set -euo pipefail
          e=target/u10-current-evidence
          sudo apt-get install -y --no-install-recommends cmake perl make pkg-config python3-venv
          cargo install --locked --version 0.20.2 cargo-deny
          python3 -m venv /tmp/u10-python
          /tmp/u10-python/bin/python -m pip install coverage==7.16.2
          /tmp/u10-python/bin/python .github/scripts/u10-current-diagnostic.py setup "$e"
          export PATH="$GITHUB_WORKSPACE/$e/tools:/tmp/u10-python/bin:$PATH"
          export COVERAGE_PROCESS_START="$GITHUB_WORKSPACE/$e/coverage.ini"
          echo "$GITHUB_WORKSPACE/$e/tools" >> "$GITHUB_PATH"
          echo "/tmp/u10-python/bin" >> "$GITHUB_PATH"
          echo "COVERAGE_PROCESS_START=$COVERAGE_PROCESS_START" >> "$GITHUB_ENV"
          python --version > "$e/python-version.txt"
          python -m coverage --version > "$e/python-coverage-version.txt"
          cargo llvm-cov show-env --sh > "$e/coverage-preflight-env.sh"
          sudo unshare --net env PATH="$PATH" RUSTC="$RUSTC" RUSTDOC="$RUSTDOC" CARGO_HOME="$HOME/.cargo" bash -c 'set -euo pipefail; source "$1"; test -n "$LLVM_PROFILE_FILE"; test -n "${RUSTC_WRAPPER:-}${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}"; cargo --version' _ "$e/coverage-preflight-env.sh" > "$e/coverage-env-preflight.log"
          printf '0\n' > "$e/coverage-env-preflight-exit.txt"
          python scripts/u10-run.py --self-test 2>&1 | tee "$e/readiness.log"
          python -m unittest discover -s tests/guests/u10/runner-tests -p 'test_*.py' -v 2>&1 | tee "$e/python-tests.log"
          set +e
          bash scripts/u10-build-guests.sh target/guests/u10 2>&1 | tee "$e/guest-build.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/guest-build-exit.txt"
          test "$status" = 0
          set +e
          sudo unshare --net env PATH="$PATH" COVERAGE_PROCESS_START="$COVERAGE_PROCESS_START" python3 scripts/u10-run.py --native-only --guest-dir target/guests/u10 --output target/u10/native 2>&1 | tee "$e/native.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/native-exit.txt"
          test "$status" = 0
          cargo test --locked -p paludarium-harness --test diff_u10 --no-run
          set +e
          sudo unshare --net env PATH="$PATH" RUSTC="$RUSTC" RUSTDOC="$RUSTDOC" CARGO_HOME="$HOME/.cargo" COVERAGE_PROCESS_START="$COVERAGE_PROCESS_START" cargo test --locked --offline -p paludarium-harness --test diff_u10 -- --include-ignored --nocapture 2>&1 | tee "$e/diff.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/diff-exit.txt"
          test "$status" = 0
      - name: Original workspace population Linux coverage
        shell: bash
        env:
          PALUDARIUM_U3_FULL_REPLAY: '1'
          PALUDARIUM_U3_NATIVE_OBSERVATIONS: ${{ github.workspace }}/target/u3-guests/observe.native
          PALUDARIUM_U3_NATIVE_FAULTS: ${{ github.workspace }}/target/u3-guests/fault-observe.native
          PALUDARIUM_U3_NATIVE_CPUID: ${{ github.workspace }}/target/u3-guests/cpuid-observe.native
        run: |
          set -euo pipefail
          e=target/u10-current-evidence
          bash tests/guests/u3/build.sh target/u3-guests
          python3 scripts/u5-coverage-native.py
          cp target/u3-guests/native-input-receipt.json "$e/coverage-native-input-receipt.json"
          cargo llvm-cov clean --workspace
          (
            source <(cargo llvm-cov show-env --sh)
            cargo build --locked -p paludarium --target-dir target/llvm-cov-target
          )
          export PALUDARIUM_U5_EMULATOR="$GITHUB_WORKSPACE/target/llvm-cov-target/debug/paludarium"
          export PALUDARIUM_U6_EMULATOR="$GITHUB_WORKSPACE/target/llvm-cov-target/debug/paludarium"
          export RUST_TEST_THREADS=1
          set +e
          cargo llvm-cov --no-clean --locked --workspace --fail-under-lines 80 2>&1 | tee "$e/coverage.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/coverage-exit.txt"
          test "$status" = 0
          cargo llvm-cov show-env --sh > "$e/coverage-env.sh"
          (
            set +e
            sudo unshare --net env PATH="$PATH" RUSTC="$RUSTC" RUSTDOC="$RUSTDOC" CARGO_HOME="$HOME/.cargo" COVERAGE_PROCESS_START="$COVERAGE_PROCESS_START" bash -c 'set -euo pipefail; source "$1"; exec cargo test --locked --offline -p paludarium-harness --test diff_u10 --target-dir target/llvm-cov-target -- --include-ignored --nocapture' _ "$e/coverage-env.sh" 2>&1 | tee "$e/coverage-u10.log"
            status=${PIPESTATUS[0]}
            printf '%s\n' "$status" > "$e/coverage-u10-exit.txt"
            test "$status" = 0
          )
          cargo llvm-cov report --locked --workspace --fail-under-lines 80
          cargo llvm-cov report --locked --workspace --lcov --output-path "$e/coverage.lcov"
          cargo llvm-cov report --locked --workspace --json --output-path "$e/coverage.json"
          printf '0\n' > "$e/coverage-report-exit.txt"
      - name: Python populations and production wasm
        shell: bash
        run: |
          set -euo pipefail
          e=target/u10-current-evidence
          sudo chown -R "$(id -u):$(id -g)" "$e" target/u10
          unset COVERAGE_PROCESS_START
          python -m coverage combine --rcfile "$e/coverage.ini"
          python -m coverage json --rcfile "$e/coverage.ini" -o "$e/python-coverage.json"
          python .github/scripts/u10-current-diagnostic.py coverage "$e/python-coverage.json"
          printf '0\n' > "$e/python-coverage-exit.txt"
          rustup component add rust-src --toolchain nightly-2026-10-10
          set +e
          bash scripts/build-wasm.sh 2>&1 | tee "$e/wasm-build.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/wasm-build-exit.txt"
          test "$status" = 0
          sha256sum packages/paludarium-wasm/paludarium.wasm > "$e/wasm.sha256"
      - name: Audit unchanged inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" target/u10-current-evidence target/u10
          e=target/u10-current-evidence
          python .github/scripts/u10-current-diagnostic.py snapshot "$e/source-after.sha256" --compare "$e/source-before.sha256"
          printf '0\n' > "$e/source-compare-exit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u10-current-native-coverage
          path: |
            target/u10-current-evidence/
            target/u5-diff/
            target/u6-diff/
            target/guests/u8/
            target/guests/u10/build-receipt.json
            target/guests/u10/*-build.log
            target/guests/u10/*-dependencies.log
            target/guests/u10/aube-deny.toml
            target/guests/u10/licenses/
            target/guests/u10/probe
            target/guests/u10/aube
            target/u10/
            target/u3-guests/
            fuzz/artifacts/
          retention-days: 7
  sanitizer-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: rust:1-bookworm
      options: --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined --ulimit=stack=-1
    env:
      ASAN_OPTIONS: detect_leaks=1
      LSAN_OPTIONS: suppressions=/work/fuzz/lsan.supp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rebuild eight instrumented targets without running fuzz
        shell: bash
        run: |
          set -euo pipefail
          e="$GITHUB_WORKSPACE/target/u10-sanitizer-binding"
          mkdir -p "$e"
          apt-get update
          apt-get install -y --no-install-recommends python3 python-is-python3 binutils llvm
          python --version > "$e/python-audit-version.txt"
          ln -s "$GITHUB_WORKSPACE" /work
          rustup toolchain install nightly-2026-10-10 --profile minimal --component llvm-tools-preview
          compiler_bin="$(rustup which --toolchain nightly-2026-10-10 rustc)"
          compiler_dir="${compiler_bin%/*}"
          export PATH="$compiler_dir:$PATH"
          export RUSTC="$compiler_bin"
          export RUSTDOC="$compiler_dir/rustdoc"
          "$compiler_bin" -Vv > "$e/compiler.txt"
          cargo -V > "$e/cargo.txt"
          cargo install --locked --version 0.13.2 cargo-fuzz
          cargo fuzz --version > "$e/fuzz-version.txt"
          cc --version > "$e/cc-version.txt"
          dpkg-query -W libc6 gcc llvm > "$e/system-packages.txt"
          env | sort > "$e/environment-variables.log"
          python .github/scripts/u10-current-diagnostic.py snapshot "$e/source-before.sha256"
          printf 'ASAN_OPTIONS=%s\nLSAN_OPTIONS=%s\nseed=1\ntimeout=30\nrss_limit_mb=2048\nmax_total_time=600\nsan=address\nbuild-only=true\n' "$ASAN_OPTIONS" "$LSAN_OPTIONS" > "$e/settings.txt"
          sha256sum fuzz/lsan.supp > "$e/suppression.sha256"
          for target in load_elf syscall_args vfs_paths mmu_ops kernel_threads_u5 kernel_futex_u5 kernel_events_u6 kernel_sockets_u6; do
            if [[ "$target" == kernel_* ]]; then cd /work; else cd "$GITHUB_WORKSPACE"; fi
            pwd > "$e/$target-build-cwd.txt"
            date -u +%FT%TZ > "$e/$target-start.txt"
            set +e
            cargo fuzz build --fuzz-dir fuzz --sanitizer address "$target" --verbose 2>&1 | tee "$e/$target-build.log"
            status=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$status" > "$e/$target-build-exit.txt"
            test "$status" = 0
            date -u +%FT%TZ > "$e/$target-end.txt"
            sha256sum "fuzz/target/x86_64-unknown-linux-gnu/release/$target" > "$e/$target-binary.sha256"
          done
      - name: Binding audit unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e=target/u10-sanitizer-binding
          python .github/scripts/u10-current-diagnostic.py snapshot "$e/source-after.sha256" --compare "$e/source-before.sha256"
          printf '0\n' > "$e/source-compare-exit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u10-current-sanitizer-binding
          path: target/u10-sanitizer-binding/
          retention-days: 7
  platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - name: Prepare actualcompiler and strict audit
        shell: bash
        run: |
          set -euo pipefail
          e=target/u10-current-evidence
          mkdir -p "$e"
          python --version > "$e/python-host-version.txt"
          rustup toolchain install nightly-2026-10-10 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          compiler_bin="$(rustup which --toolchain nightly-2026-10-10 rustc | tr '\\' '/')"
          rustdoc_bin="$(rustup which --toolchain nightly-2026-10-10 rustdoc | tr '\\' '/')"
          compiler_dir="${compiler_bin%/*}"
          echo "$compiler_dir" >> "$GITHUB_PATH"
          echo "RUSTC=$compiler_bin" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_bin" >> "$GITHUB_ENV"
          "$compiler_bin" -Vv > "$e/compiler.txt"
          "$compiler_dir/cargo" -V > "$e/cargo.txt"
          python .github/scripts/u10-current-diagnostic.py snapshot "$e/source-before.sha256"
      - name: Workspace regressions and quality
        shell: bash
        run: |
          set -euo pipefail
          e=target/u10-current-evidence
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends musl-tools
            rustup target add --toolchain nightly-2026-10-10 x86_64-unknown-linux-musl
          fi
          set +e
          cargo test --locked -p paludarium-types -p paludarium-decoder -p paludarium-mmu -p paludarium-cpu -p paludarium-loader -p paludarium-vfs -p paludarium-kernel -p paludarium-host -p paludarium-jit -p paludarium-runtime -p paludarium 2>&1 | tee "$e/lib.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/lib-exit.txt"
          test "$status" = 0
          test -s "$e/lib.log"
          cargo test --locked -p paludarium-harness --lib 2>&1 | tee "$e/harness-lib.log"
          printf '0\n' > "$e/harness-lib-exit.txt"
          set +e
          cargo test --locked -p paludarium-kernel -p paludarium-runtime --lib u5_tests:: 2>&1 | tee "$e/u5-lib.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/u5-lib-exit.txt"
          test "$status" = 0
          python .github/scripts/u8-current-diagnostic.py lib "$e/u5-lib.log" --unit u5
          set +e
          cargo test --locked -p paludarium-kernel --lib u6_tests:: 2>&1 | tee "$e/u6-lib.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/u6-lib-exit.txt"
          test "$status" = 0
          python .github/scripts/u8-current-diagnostic.py lib "$e/u6-lib.log" --unit u6
          set +e
          cargo fmt --all -- --check 2>&1 | tee "$e/fmt.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/fmt-exit.txt"
          test "$status" = 0
          set +e
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee "$e/clippy.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/clippy-exit.txt"
          test "$status" = 0
          cargo install --locked --version 0.20.2 cargo-deny
          cargo deny --version > "$e/deny-version.txt"
          set +e
          cargo deny check advisories 2>&1 | tee "$e/deny-advisories.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/deny-advisories-exit.txt"
          test "$status" = 0
          set +e
          cargo deny check bans 2>&1 | tee "$e/deny-bans.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/deny-bans-exit.txt"
          test "$status" = 0
          set +e
          cargo deny check licenses 2>&1 | tee "$e/deny-licenses.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/deny-licenses-exit.txt"
          test "$status" = 0
          set +e
          cargo deny check sources 2>&1 | tee "$e/deny-sources.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$e/deny-sources-exit.txt"
          test "$status" = 0
      - name: Audit unchanged inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e=target/u10-current-evidence
          python .github/scripts/u10-current-diagnostic.py snapshot "$e/source-after.sha256" --compare "$e/source-before.sha256"
          printf '0\n' > "$e/source-compare-exit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u10-current-platform-${{ matrix.os }}
          path: |
            target/u10-current-evidence/
            target/u5-diff/
            target/u6-diff/
            target/guests/u8/
            target/guests/u10/build-receipt.json
            target/guests/u10/*-build.log
            target/guests/u10/*-dependencies.log
            target/guests/u10/aube-deny.toml
            target/guests/u10/licenses/
            target/guests/u10/probe
            target/guests/u10/aube
            target/u10/
            target/u3-guests/
            fuzz/artifacts/
          retention-days: 7
