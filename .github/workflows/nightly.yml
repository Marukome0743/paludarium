# Nightly checks (team.md Testing Posture, Q7; CI Pipeline design ci-config.md, Q2 A):
# fuzzing (u14-fuzz.yml: thirteen targets for 600 seconds each with ASan and LSan) and the
# full quality check (u14-quality.yml: Linux, macOS and Windows, the four wasm environments
# with the real Safari, JIT on/off agreement and the frozen performance measurement).
# A failure opens an Issue to be fixed; it never blocks a merge. Actions are pinned by
# commit SHA and the default token is read-only; only the reporting job may write Issues.
name: Nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: ./.github/workflows/u14-fuzz.yml
  quality:
    uses: ./.github/workflows/u14-quality.yml

  report-failure:
    needs: [fuzz, quality]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open an Issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Nightly checks failed ($(date -u +%Y-%m-%d))" \
            --body "The nightly fuzzing or quality check failed: $RUN_URL"
